name: grid_master
description: "Color Grid Master - A memory game"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  easy_localization: ^3.0.7
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.3.0
  flutter_dotenv: ^5.2.1
  purchases_flutter: ^9.10.4
  purchases_ui_flutter: ^9.10.4
  audio_session: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/translations/
    - assets/audio/
    - assets/img/
